name: Chess Topper Android Build

on:
  push:
    branches: [main]
    tags: ["mobile-v*"]
  workflow_dispatch:

concurrency:
  group: chess-topper-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        run: npm run android:setup

      - name: Build mobile interface
        run: npm run build

      - name: Sync web assets and Capacitor plugins
        run: npx cap sync android

      - name: Commit generated Android Studio project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "Android project is already current."
          else
            git commit -m "Generate Android Studio project"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Build Chess Topper APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          mkdir -p ../release-output
          cp app/build/outputs/apk/debug/app-debug.apk ../release-output/Chess-Topper-1.0.4.apk

      - name: Verify APK identity and package
        run: |
          test -s release-output/Chess-Topper-1.0.4.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release-output/Chess-Topper-1.0.4.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='com.officialknightly.chesstopper.mobile'" /tmp/apk-badging.txt
          grep -q "application-label:'Chess Topper'" /tmp/apk-badging.txt

      - name: Upload installable Chess Topper APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Topper-Android-1.0.4
          path: release-output/Chess-Topper-1.0.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable Android APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Chess Topper Mobile — Latest Android APK
          target_commitish: ${{ github.sha }}
          body: |
            Installable Android APK for Chess Topper Mobile.\n\n            Version: 1.0.4

            This is an Android-only release. Install the APK on an Android phone.
            Floating controls are intended for training, puzzles and post-game analysis,
            not assistance during live rated games. The app does not read screen contents or automate moves.
          files: release-output/Chess-Topper-1.0.4.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
