name: Import Chess Topper source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile repository
        uses: actions/checkout@v4
        with:
          path: mobile
          token: ${{ github.token }}
      - name: Check out desktop Chess Topper source
        uses: actions/checkout@v4
        with:
          repository: official-knightly/Chess-topper-app-
          ref: main
          path: desktop-source
          persist-credentials: false
      - name: Copy complete app source into mobile repository
        shell: bash
        run: |
          rsync -a --exclude='.git/' --exclude='.github/workflows/' --exclude='node_modules/' --exclude='release/' desktop-source/ mobile/
      - name: Commit imported source
        working-directory: mobile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No imported source changes."
            exit 0
          fi
          git commit -m "Import complete Chess Topper desktop source for mobile port"
          git push origin HEAD:main
